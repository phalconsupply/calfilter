<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Upload</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h2>Test File Upload to Handler</h2>
    
    <form id="uploadForm">
        <input type="file" id="fileInput" accept=".xlsx,.xls" required>
        <button type="submit">Test Upload</button>
    </form>
    
    <div class="result" id="result"></div>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            const fileInput = document.getElementById('fileInput');
            
            if (!fileInput.files[0]) {
                resultDiv.innerHTML = '<p style="color: red;">Please select a file</p>';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            resultDiv.innerHTML = '<p>Uploading...</p>';
            
            try {
                // Test with v2 handler
                const response = await fetch('hospital_import_handler_v2.php', {
                    method: 'POST',
                    body: formData
                });
                
                resultDiv.innerHTML = `
                    <h3>Response Status: ${response.status}</h3>
                    <h4>Content-Type: ${response.headers.get('content-type')}</h4>
                `;
                
                const text = await response.text();
                resultDiv.innerHTML += `<h4>Raw Response (first 500 chars):</h4>`;
                resultDiv.innerHTML += `<pre>${text.substring(0, 500)}</pre>`;
                
                try {
                    const json = JSON.parse(text);
                    resultDiv.innerHTML += `<h4>Parsed JSON:</h4>`;
                    resultDiv.innerHTML += `<pre>${JSON.stringify(json, null, 2)}</pre>`;
                    
                    if (json.success) {
                        resultDiv.style.borderColor = 'green';
                        resultDiv.innerHTML += `<p style="color: green;">✓ SUCCESS!</p>`;
                    } else {
                        resultDiv.style.borderColor = 'orange';
                        resultDiv.innerHTML += `<p style="color: orange;">⚠ Failed but got JSON response</p>`;
                    }
                } catch(e) {
                    resultDiv.style.borderColor = 'red';
                    resultDiv.innerHTML += `<h4 style="color: red;">JSON Parse Error: ${e.message}</h4>`;
                    resultDiv.innerHTML += `<pre>${text}</pre>`;
                }
                
            } catch(error) {
                resultDiv.innerHTML = `<h3 style="color: red;">Fetch Error: ${error.message}</h3>`;
            }
        });
    </script>
</body>
</html>
