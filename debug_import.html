<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Debug Hospital Import</title>
</head>
<body>
    <h2>Test Hospital Import Handler</h2>
    <div id="result"></div>
    
    <script>
        async function testEndpoint() {
            const resultDiv = document.getElementById('result');
            
            try {
                // Test 1: GET request
                resultDiv.innerHTML += '<h3>Test 1: GET Request</h3>';
                const response1 = await fetch('hospital_import_handler.php');
                const text1 = await response1.text();
                resultDiv.innerHTML += `<pre>Response: ${text1.substring(0, 500)}</pre>`;
                
                // Test 2: Check response headers
                resultDiv.innerHTML += '<h3>Test 2: Response Headers</h3>';
                resultDiv.innerHTML += `<pre>Content-Type: ${response1.headers.get('content-type')}</pre>`;
                resultDiv.innerHTML += `<pre>Status: ${response1.status}</pre>`;
                
                // Test 3: Try to parse as JSON
                resultDiv.innerHTML += '<h3>Test 3: Try Parse JSON</h3>';
                try {
                    const json = JSON.parse(text1);
                    resultDiv.innerHTML += `<pre>${JSON.stringify(json, null, 2)}</pre>`;
                } catch(e) {
                    resultDiv.innerHTML += `<pre style="color: red;">JSON Parse Error: ${e.message}</pre>`;
                    resultDiv.innerHTML += `<pre>First 200 chars: ${text1.substring(0, 200)}</pre>`;
                }
                
                // Test 4: Check file paths
                resultDiv.innerHTML += '<h3>Test 4: Check Files</h3>';
                const testResponse = await fetch('test_phpspreadsheet.php');
                const testJson = await testResponse.json();
                resultDiv.innerHTML += `<pre>${JSON.stringify(testJson, null, 2)}</pre>`;
                
            } catch(error) {
                resultDiv.innerHTML += `<h3 style="color: red;">Error: ${error.message}</h3>`;
            }
        }
        
        testEndpoint();
    </script>
</body>
</html>
